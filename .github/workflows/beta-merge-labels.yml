name: Label issues merged to beta

# GitHub only auto-closes "Closes #N" when a change reaches the DEFAULT branch,
# which for us is main. Merging into beta therefore leaves issues looking
# untouched even though the work is written and deployed to the test system.
#
# This labels them 'in-beta' instead of closing them, which is the honest state:
# the work exists and is soaking, but it is not in production. When beta is
# promoted to main, GitHub's native behaviour closes them for real.
on:
  pull_request:
    types: [closed]
    branches: [beta]

permissions:
  issues: write
  pull-requests: read

jobs:
  label:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request;

            // Closing keywords can live in the PR body or in any commit message,
            // so scan both — our commits carry them more often than the body does.
            const commits = await github.paginate(
              github.rest.pulls.listCommits,
              { owner, repo, pull_number: pr.number, per_page: 100 },
            );
            const haystack = [pr.body || '', ...commits.map((c) => c.commit.message)].join('\n');

            const re = /\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#(\d+)\b/gi;
            const issues = [...new Set([...haystack.matchAll(re)].map((m) => Number(m[1])))];

            if (issues.length === 0) {
              core.info('No closing keywords found; nothing to label.');
              return;
            }

            const LABEL = 'in-beta';
            try {
              await github.rest.issues.getLabel({ owner, repo, name: LABEL });
            } catch {
              await github.rest.issues.createLabel({
                owner,
                repo,
                name: LABEL,
                color: 'A8501A',
                description: 'Merged to beta, soaking. Closes when beta is promoted to main.',
              });
            }

            for (const number of issues) {
              try {
                await github.rest.issues.addLabels({
                  owner, repo, issue_number: number, labels: [LABEL],
                });
                core.info(`Labelled #${number}`);
              } catch (e) {
                // A referenced number may be a PR, or may not exist. Do not fail
                // the run over one bad reference.
                core.warning(`Could not label #${number}: ${e.message}`);
              }
            }
